# One-off measurement, on the measure branch only: where the time inside
# `prismpm verify` goes. Each phase runs cold, in its own container on its own
# copy of prism/, in the SDK image prismpm.lock pins.
name: measure

on:
  push:
    branches: [measure]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pull the SDK image once
        shell: bash
        run: |
          set -euo pipefail
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          echo "IMAGE=$image" >>"$GITHUB_ENV"
          start=$(date +%s)
          docker pull --quiet "$image"
          echo "PHASE image-pull $(( $(date +%s) - start ))s"
      - name: Time each phase cold
        shell: bash
        run: |
          set -euo pipefail
          docker_config=$(mktemp -d)
          printf '{}\n' >"$docker_config/config.json"
          mkdir -p telemetry
          phase() {
            local name=$1 command=$2
            rm -rf "m-$name" && cp -r prism "m-$name"
            mkdir -p "telemetry/$name"
            local start=$(date +%s)
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --group-add "$(stat -c '%g' /var/run/docker.sock)" \
              --tmpfs /tmp:rw,exec,nosuid,size=2g \
              --volume "$PWD:$PWD" \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$docker_config:/tmp/prismpm-home/.docker:ro" \
              --workdir "$PWD/m-$name" \
              --env DOCKER_CONFIG=/tmp/prismpm-home/.docker \
              --env BUILDX_CONFIG=/tmp/prismpm-buildx \
              --env HOME=/tmp/prismpm-home \
              --env PRISMPM_EPHEMERAL_HOME=1 \
              --env LEXLEAN_CI_TELEMETRY="$PWD/telemetry/$name" \
              "$IMAGE" sh -c "lexlean lock && lexlean fmt --all && lexlean lock && $command" 2>&1 \
              | while IFS= read -r line; do printf '%s %s\n' "$(date +%T)" "$line"; done
            echo "PHASE $name $(( $(date +%s) - start ))s"
          }
          phase prismpm-verify 'prismpm verify'
      - name: Keep the telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telemetry
          path: |
            telemetry
            m-prismpm-verify/.prism/**/*.json
          if-no-files-found: warn
